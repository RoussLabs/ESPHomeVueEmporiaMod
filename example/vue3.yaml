# Emporia Vue 3 on ESPHome using the RoussLabs fork of emporia-vue-local.
# Based on the upstream vue3.yaml reference config; every option added by this
# fork is used below so it doubles as documentation.
#
# Fill in: circuit names, phase_id per breaker, calibration values.
# Delete ct_clamps entries you don't use (or leave them; empty ports now read NaN).

esphome:
  name: emporia-vue-3
  friendly_name: Emporia Vue 3

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

external_components:
  - source: github://RoussLabs/ESPHomeVueEmporiaMod@main
    components: [emporia_vue]
    # refresh: 0s   # while testing: re-fetch the component on every build (default is 1 day)

# API + OTA encryption; assign a unique key from the ESPHome Device Builder.
api:
  encryption:
    key:

ota:
  - platform: esphome
    encryption:

logger:
  level: DEBUG
  logs:
    sensor: INFO   # every 200 ms reading would otherwise be printed

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - light.turn_on: wifi_led
  on_disconnect:
    - light.turn_off: wifi_led

time:
  - platform: homeassistant

switch:
  - platform: restart
    name: Restart

preferences:
  # avoid wearing out the flash with rapidly-updating sensor data;
  # also keep `restore: false` on every total_daily_energy sensor
  flash_write_interval: "48h"

light:
  - platform: status_led
    id: wifi_led
    pin:
      number: 2
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: status_led
    id: ethernet_led
    pin: 4
    restore_mode: ALWAYS_OFF

i2c:
  sda:
    number: 5
    ignore_strapping_warning: true
  scl: 18
  scan: false
  frequency: 400kHz   # try 150kHz if the diagnostic counters climb
  timeout: 1ms
  id: i2c_a

substitutions:
  leg_1: "L1"
  leg_2: "L2"
  # Port-based names; rename to the appliance in Home Assistant so moving a CT
  # to another port never changes an entity's unique ID.
  cir_1: "CT 1"
  cir_2: "CT 2"
  cir_3: "CT 3"
  cir_4: "CT 4"
  cir_5: "CT 5"
  cir_6: "CT 6"
  cir_7: "CT 7"
  cir_8: "CT 8"
  cir_9: "CT 9"
  cir_10: "CT 10"
  cir_11: "CT 11"
  cir_12: "CT 12"
  cir_13: "CT 13"
  cir_14: "CT 14"
  cir_15: "CT 15"
  cir_16: "CT 16"
  xtra: "Balance"

.filters:
  - &throttle_avg
    throttle_average: 5s
  - &throttle_time
    throttle: 60s
  - &neg
    lambda: 'return max(-x, 0.0f);'
  - &pos
    lambda: 'return max(x, 0.0f);'

sensor:
  - platform: emporia_vue
    variant: vue3
    i2c_id: i2c_a

    # --- fork options -------------------------------------------------------
    frequency_samples: 25            # ~6 s of raw period counts -> ~0.01 Hz
    # checksum: none      -> upstream behaviour, packets are not verified
    # checksum: crc8      -> verify the packet CRC-8 and drop corrupted packets (verified on Vue 3)
    # checksum: discover  -> never drop; log the CRC result and a raw dump of every
    #                        port (first 10 packets, then once a minute). Use this
    #                        for diagnosing CT wiring; see README "Reading a raw dump".
    checksum: crc8
    i2c_errors:         { name: "Vue I2C Errors" }
    malformed_readings: { name: "Vue Malformed Readings" }
    missed_readings:    { name: "Vue Missed Readings" }

    phases:
      - id: phase_a
        input: BLACK
        calibration: 0.01922         # L1 on the RoussLabs unit vs a Fluke 87V (124.58 V); new = old * V_meter / V_vue
        voltage:   { name: "${leg_1} Voltage",   filters: [*throttle_avg, *pos] }
        frequency_constant: 19623    # RoussLabs unit vs Fluke 87V (60.01 Hz); upstream default 19610
        frequency: { name: "Grid Frequency",     accuracy_decimals: 2, filters: [*throttle_avg, *pos] }
      - id: phase_b
        input: RED
        calibration: 0.01923         # L2 on the RoussLabs unit vs a Fluke 87V (124.46 V)
        voltage:     { name: "${leg_2} Voltage",     filters: [*throttle_avg, *pos] }
        phase_angle: { name: "${leg_2} Phase Angle", filters: [*throttle_avg, *pos] }

    # line-to-line "phase" for pure 240 V loads measured with one CT
    virtual_phases:
      - id: leg_1_2
        combine: [phase_a, phase_b]
        angle: 180                   # 180 = split-phase 240 V, 120 = 208 V from a wye
        voltage: { name: "${leg_1}-${leg_2} Voltage", filters: [*throttle_avg] }

    ct_clamps:
      # Mains. Keep these unnamed (id only); throttled copies go to HA below.
      - phase_id: phase_a
        input: "A"
        calibration: 1.0
        power:   { id: phase_a_power, filters: [*pos] }
        current: { id: phase_a_current }
        apparent_power: { id: phase_a_va }
        power_factor:   { id: phase_a_pf }
      - phase_id: phase_b
        input: "B"
        calibration: 1.0
        power:   { id: phase_b_power, filters: [*pos] }
        current: { id: phase_b_current }
        apparent_power: { id: phase_b_va }
        power_factor:   { id: phase_b_pf }

      # Branch circuits. Set phase_id per breaker leg (sign check: a loaded circuit
      # with negative power or PF is on the wrong leg). Vue 3 branch inputs read
      # inverted, hence invert: true; *pos then just clamps noise below zero.
      # Every CT gets a power_factor; a negative PF under load flags a wrong leg
      # or a backwards clamp instantly, where power alone would silently read 0.
      - { phase_id: phase_a, input:  "1", invert: true, power: { id:  cir1, filters: [*pos] }, power_factor: { id:  cir1_pf } }
      - { phase_id: phase_b, input:  "2", invert: true, power: { id:  cir2, filters: [*pos] }, power_factor: { id:  cir2_pf } }
      - { phase_id: phase_a, input:  "3", invert: true, power: { id:  cir3, filters: [*pos] }, power_factor: { id:  cir3_pf } }
      - { phase_id: phase_b, input:  "4", invert: true, power: { id:  cir4, filters: [*pos] }, power_factor: { id:  cir4_pf } }
      - { phase_id: phase_a, input:  "5", invert: true, power: { id:  cir5, filters: [*pos] }, power_factor: { id:  cir5_pf } }
      - { phase_id: phase_b, input:  "6", invert: true, power: { id:  cir6, filters: [*pos] }, power_factor: { id:  cir6_pf } }
      - { phase_id: phase_a, input:  "7", invert: true, power: { id:  cir7, filters: [*pos] }, power_factor: { id:  cir7_pf } }
      - { phase_id: phase_b, input:  "8", invert: true, power: { id:  cir8, filters: [*pos] }, power_factor: { id:  cir8_pf } }
      - { phase_id: phase_a, input:  "9", invert: true, power: { id:  cir9, filters: [*pos] }, power_factor: { id:  cir9_pf } }
      - { phase_id: leg_1_2, input: "10", invert: true, power: { id: cir10, filters: [*pos] }, power_factor: { id: cir10_pf } }   # 240 V load, no neutral, one CT
      - { phase_id: phase_a, input: "11", invert: true, power: { id: cir11, filters: [*pos] }, power_factor: { id: cir11_pf } }
      - { phase_id: phase_b, input: "12", invert: true, power: { id: cir12, filters: [*pos] }, power_factor: { id: cir12_pf } }
      - { phase_id: phase_a, input: "13", invert: true, power: { id: cir13, filters: [*pos] }, power_factor: { id: cir13_pf } }
      - { phase_id: phase_b, input: "14", invert: true, power: { id: cir14, filters: [*pos] }, power_factor: { id: cir14_pf } }
      - { phase_id: phase_a, input: "15", invert: true, power: { id: cir15, filters: [*pos] }, power_factor: { id: cir15_pf } }
      - { phase_id: phase_b, input: "16", invert: true, power: { id: cir16, filters: [*pos] }, power_factor: { id: cir16_pf } }
    on_update:
      then:
        - component.update: total_power
        - component.update: balance_power
        - component.update: ct1_2_power       # one line per two-leg sum below
        - component.update: ct8_9_power

  # throttled copies for HA
  - { platform: copy, name: "${leg_1} Power",          source_id: phase_a_power,   filters: *throttle_avg }
  - { platform: copy, name: "${leg_2} Power",          source_id: phase_b_power,   filters: *throttle_avg }
  - { platform: copy, name: "${leg_1} Current",        source_id: phase_a_current, filters: *throttle_avg }
  - { platform: copy, name: "${leg_2} Current",        source_id: phase_b_current, filters: *throttle_avg }
  - { platform: copy, name: "${leg_1} Apparent Power", source_id: phase_a_va,      filters: *throttle_avg }
  - { platform: copy, name: "${leg_2} Apparent Power", source_id: phase_b_va,      filters: *throttle_avg }
  - { platform: copy, name: "${leg_1} Power Factor",   source_id: phase_a_pf,      filters: *throttle_avg }
  - { platform: copy, name: "${leg_2} Power Factor",   source_id: phase_b_pf,      filters: *throttle_avg }
  - { platform: copy, name: "Total Power",             source_id: total_power,     filters: *throttle_avg }
  - { platform: copy, name: "${xtra} Power",           source_id: balance_power,   filters: *throttle_avg }
  - { platform: copy, name:  "${cir_1} Power", source_id:  cir1, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_2} Power", source_id:  cir2, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_3} Power", source_id:  cir3, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_4} Power", source_id:  cir4, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_5} Power", source_id:  cir5, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_6} Power", source_id:  cir6, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_7} Power", source_id:  cir7, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_8} Power", source_id:  cir8, filters: *throttle_avg }
  - { platform: copy, name:  "${cir_9} Power", source_id:  cir9, filters: *throttle_avg }
  - { platform: copy, name: "${cir_10} Power", source_id: cir10, filters: *throttle_avg }
  - { platform: copy, name: "${cir_11} Power", source_id: cir11, filters: *throttle_avg }
  - { platform: copy, name: "${cir_12} Power", source_id: cir12, filters: *throttle_avg }
  - { platform: copy, name: "${cir_13} Power", source_id: cir13, filters: *throttle_avg }
  - { platform: copy, name: "${cir_14} Power", source_id: cir14, filters: *throttle_avg }
  - { platform: copy, name: "${cir_15} Power", source_id: cir15, filters: *throttle_avg }
  - { platform: copy, name: "${cir_16} Power", source_id: cir16, filters: *throttle_avg }

  # Same 5 s rate as power, so every reading in a graph lines up.
  # See NOTES.md for recorder sizing and how to monitor the database.
  - { platform: copy, name: "${cir_1} Power Factor", source_id: cir1_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_2} Power Factor", source_id: cir2_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_3} Power Factor", source_id: cir3_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_4} Power Factor", source_id: cir4_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_5} Power Factor", source_id: cir5_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_6} Power Factor", source_id: cir6_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_7} Power Factor", source_id: cir7_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_8} Power Factor", source_id: cir8_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_9} Power Factor", source_id: cir9_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_10} Power Factor", source_id: cir10_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_11} Power Factor", source_id: cir11_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_12} Power Factor", source_id: cir12_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_13} Power Factor", source_id: cir13_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_14} Power Factor", source_id: cir14_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_15} Power Factor", source_id: cir15_pf, filters: *throttle_avg }
  - { platform: copy, name: "${cir_16} Power Factor", source_id: cir16_pf, filters: *throttle_avg }

  - platform: template
    id: total_power
    lambda: return id(phase_a_power).state + id(phase_b_power).state;
    update_interval: never
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
  - platform: total_daily_energy
    name: "Total Daily Energy"
    power_id: total_power
    accuracy_decimals: 0
    restore: false
    filters: *throttle_time

  # --- Sums for two-leg 120/240 V circuits with a neutral (range, dryer) -------
  # Each leg has its own CT (1+2 and 8+9 here; adjust). Named by port like
  # everything else; give them the appliance name in Home Assistant.
  # Put the summed Daily Energy in the HA Energy dashboard, not the per-leg ones.
  - platform: template
    name: "CT 8+9 Power"
    id: ct8_9_power
    lambda: return id(cir8).state + id(cir9).state;
    update_interval: never                 # refreshed from on_update above
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    filters: *throttle_avg
  - platform: total_daily_energy
    name: "CT 8+9 Daily Energy"
    power_id: ct8_9_power
    accuracy_decimals: 0
    restore: false
    filters: *throttle_time

  - platform: template
    name: "CT 1+2 Power"
    id: ct1_2_power
    lambda: return id(cir1).state + id(cir2).state;
    update_interval: never
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    filters: *throttle_avg
  - platform: total_daily_energy
    name: "CT 1+2 Daily Energy"
    power_id: ct1_2_power
    accuracy_decimals: 0
    restore: false
    filters: *throttle_time

  - platform: template
    id: balance_power
    lambda: !lambda |-
      // circuits with no CT publish NaN; skip them so they don't poison the sum
      float sum = 0.0f;
      for (float p : { id( cir1).state, id( cir2).state, id( cir3).state, id( cir4).state,
                       id( cir5).state, id( cir6).state, id( cir7).state, id( cir8).state,
                       id( cir9).state, id(cir10).state, id(cir11).state, id(cir12).state,
                       id(cir13).state, id(cir14).state, id(cir15).state, id(cir16).state }) {
        if (!std::isnan(p)) sum += p;
      }
      return max(0.0f, id(total_power).state - sum);
    update_interval: never
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
  - platform: total_daily_energy
    name: "${xtra} Daily Energy"
    power_id: balance_power
    accuracy_decimals: 0
    restore: false
    filters: *throttle_time

  - { power_id:  cir1, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_1} Daily Energy", filters: *throttle_time }
  - { power_id:  cir2, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_2} Daily Energy", filters: *throttle_time }
  - { power_id:  cir3, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_3} Daily Energy", filters: *throttle_time }
  - { power_id:  cir4, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_4} Daily Energy", filters: *throttle_time }
  - { power_id:  cir5, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_5} Daily Energy", filters: *throttle_time }
  - { power_id:  cir6, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_6} Daily Energy", filters: *throttle_time }
  - { power_id:  cir7, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_7} Daily Energy", filters: *throttle_time }
  - { power_id:  cir8, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_8} Daily Energy", filters: *throttle_time }
  - { power_id:  cir9, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name:  "${cir_9} Daily Energy", filters: *throttle_time }
  - { power_id: cir10, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_10} Daily Energy", filters: *throttle_time }
  - { power_id: cir11, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_11} Daily Energy", filters: *throttle_time }
  - { power_id: cir12, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_12} Daily Energy", filters: *throttle_time }
  - { power_id: cir13, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_13} Daily Energy", filters: *throttle_time }
  - { power_id: cir14, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_14} Daily Energy", filters: *throttle_time }
  - { power_id: cir15, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_15} Daily Energy", filters: *throttle_time }
  - { power_id: cir16, platform: total_daily_energy, accuracy_decimals: 0, restore: false, name: "${cir_16} Daily Energy", filters: *throttle_time }
